name: node build

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Cache npm
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Build webui
      run: |
        set -x
        npm install
        npm run build
      env:
        NODE_OPTIONS: --openssl-legacy-provider

    - name: Prepare data
      run: |
        set -x
        mkdir -p data
        for f in $(find gzipped/static -name "*.js.gz" -o -name "*.css.gz"); do cp -f $f data; done
        cp -f gzipped/index.html.gz data
        cp -f gzipped/favicon.ico.gz data
        cp build/index.html data/index-cdn.html
        sed -i 's#href="#href="https://coderus.github.io/led-lamp-webui#g' data/index-cdn.html
        sed -i 's#src="#src="https://coderus.github.io/led-lamp-webui#g' data/index-cdn.html
        gzip data/index-cdn.html

    - name: Upload build result
      uses: actions/upload-artifact@v4
      with:
        name: artifacts
        path: data

    - name: Create release
      if: github.ref == 'refs/heads/master'
      run: |
        set -x
        RELEASE_TAG="$(date +'%Y%m%d%H%M%S')-$(git log --format=%h -1)"
        gh release create "$RELEASE_TAG" data/*.gz -t "$RELEASE_TAG"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Deploy GH Actions
      if: github.ref == 'refs/heads/master'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: build
        branch: gh-pages

